name: A-share validation and ingestion pilot
on:
  push:
    paths:
      - '.github/workflows/a-share-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a-share-validation-pilot
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --disable-pip-version-check akshare==1.20.65 baostock
      - name: Validate sources
        run: |
          mkdir -p results
          python - <<'PY'
          import akshare as ak, pandas as pd, datetime as dt, json, time, re, os, traceback, inspect
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from decimal import Decimal
          out=Path("results")
          now=dt.datetime.now(ZoneInfo("Asia/Shanghai"))
          end=now.date()
          start=end-dt.timedelta(days=3653)
          short=end-dt.timedelta(days=21)
          fmt=lambda d:d.strftime("%Y%m%d")
          report={"run_id":os.environ["GITHUB_RUN_ID"],"collected_at":now.isoformat(),"akshare":ak.__version__,"tests":{},"scope":"one-time exchange master validation and stratified sample; not production ingestion"}
          def resolve(name):
              try: return name,getattr(ak,name)
              except AttributeError as e:
                  m=re.search(r"请改用 ak\.([a-zA-Z0-9_]+)",str(e))
                  if not m: raise
                  return m.group(1),getattr(ak,m.group(1))
          def call(label,name,**kwargs):
              t=time.monotonic()
              try:
                  actual,fn=resolve(name)
                  sig=inspect.signature(fn)
                  # Do not silently discard requested parameters.
                  sig.bind(**kwargs)
                  df=fn(**kwargs)
                  if not isinstance(df,pd.DataFrame) or df.empty: raise ValueError("empty/non-dataframe")
                  df.to_csv(out/(label+".csv"),index=False,encoding="utf-8-sig")
                  report["tests"][label]={"interface":actual,"rows":len(df),"columns":list(map(str,df.columns)),"missing_cells":int(df.isna().sum().sum()),"seconds":round(time.monotonic()-t,2)}
                  return df
              except Exception as e:
                  report["tests"][label]={"requested":name,"error":repr(e),"seconds":round(time.monotonic()-t,2)}
                  traceback.print_exc()
                  return None
              finally: time.sleep(1)
          def codes(df):
              if df is None:return set()
              col=next((c for c in df.columns if str(c).lower() in ("代码","股票代码","证券代码","a股代码","a股证券代码","code","symbol")),None)
              if col is None:return set()
              return set(df[col].astype(str).str.strip().str.extract(r"^(?:sh|sz|bj)?(\d{1,6})$",expand=False).dropna().str.zfill(6))
          exchange={}
          for label,fn,kw in [("sse_main","stock_info_sh_name_code",{"symbol":"主板A股"}),("sse_star","stock_info_sh_name_code",{"symbol":"科创板"}),("szse","stock_info_sz_name_code",{"symbol":"A股列表"}),("bse","stock_info_bj_name_code",{})]:
              exchange[label]=codes(call(label,fn,**kw))
          master=set().union(*exchange.values())
          report["official_master"]={"counts":{k:len(v) for k,v in exchange.items()},"unique":len(master),"complete":all(exchange.values())}
          # BaoStock secondary reference is not an exchange official list.
          try:
              import baostock as bs
              lg=bs.login()
              if lg.error_code!="0": raise RuntimeError(lg.error_msg)
              try:
                  rs=bs.query_stock_basic()
                  rows=[]
                  while rs.error_code=="0" and rs.next(): rows.append(rs.get_row_data())
                  if rs.error_code!="0": raise RuntimeError(rs.error_msg)
                  df=pd.DataFrame(rows,columns=rs.fields)
                  df=df[(df["type"]=="1") & (df["status"]=="1")]
                  df.to_csv(out/"baostock_reference.csv",index=False)
                  bc=set(df.code.str.split(".").str[-1])
                  report["baostock"]={"rows":len(df),"official_overlap":len(bc&master),"official_missing_from_baostock":len(master-bc),"note":"coverage depends on BaoStock; not official"}
              finally: bs.logout()
          except Exception as e: report["baostock"]={"error":repr(e)}
          samples=["sh600519","sh688521","sz000001","sz300750"]
          if exchange["bse"]:
              samples.append("bj"+sorted(exchange["bse"])[0])
          report["samples"]=samples
          def normalize(df):
              if df is None:return None
              mp={"日期":"date","开盘":"open","收盘":"close","最高":"high","最低":"low"}
              d=df.rename(columns=mp).copy()
              if not set(["date","open","close","high","low"]).issubset(d.columns):return None
              d["date"]=pd.to_datetime(d["date"],errors="coerce").dt.strftime("%Y-%m-%d")
              return d[["date","open","close","high","low"]].dropna().set_index("date")
          report["cross_checks"]={}
          for s in samples:
              code=s[2:]
              tx=call("hist_tx_"+code,"stock_zh_a_hist_tx",symbol=s,start_date=fmt(start),end_date=fmt(end),adjust="")
              # New Sina function may require period; inspect before calling.
              try:
                  _,sf=resolve("stock_zh_a_hist_sina")
                  sk={"symbol":s,"start_date":fmt(short),"end_date":fmt(end),"adjust":""}
                  if "period" in inspect.signature(sf).parameters:sk["period"]="daily"
                  si=call("hist_sina_"+code,"stock_zh_a_hist_sina",**sk)
              except Exception as e:
                  si=None
                  report["tests"]["hist_sina_"+code]={"error":repr(e)}
              x,y=normalize(tx),normalize(si)
              if x is not None and y is not None and x.index.is_unique and y.index.is_unique:
                  common=x.index.intersection(y.index)
                  delta=(x.loc[common].astype(float)-y.loc[common].astype(float)).abs()
                  report["cross_checks"][code]={"common_days":len(common),"matching_ohlc_days":int((delta<=0.011).all(axis=1).sum()),"latest_common":max(common) if len(common) else None}
              else:report["cross_checks"][code]={"status":"unavailable or duplicate dates"}
              call("valuation_"+code,"stock_a_indicator_lg",symbol=code)
              call("financial_"+code,"stock_financial_analysis_indicator",symbol=code,start_year=str(end.year-5))
          report["production_status"]="NOT deployed; require coverage and rights verification before scaling or scheduling"
          (out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-validation-pilot
          path: results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish run status only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,requests
          from pathlib import Path
          p=Path("results/report.json")
          data={"run_id":os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"],"report_generated":p.exists(),"run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]}
          url=os.environ["GITHUB_API_URL"]+"/repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/test-status/a-share-validation.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          old=requests.get(url,headers=headers,timeout=20)
          payload={"message":"Record validation pilot run pointer","content":base64.b64encode(json.dumps(data,indent=2).encode()).decode(),"branch":"main"}
          if old.status_code==200: payload["sha"]=old.json()["sha"]
          elif old.status_code!=404: old.raise_for_status()
          requests.put(url,headers=headers,json=payload,timeout=20).raise_for_status()
          PY
