name: A-share universe baseline
on:
  push:
    paths:
      - '.github/workflows/a-share-universe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested version
        run: python -m pip install --disable-pip-version-check akshare==1.20.65
      - name: Scan market and validate coverage
        run: |
          mkdir -p results
          python - <<'PY'
          import akshare as ak, pandas as pd, json, traceback, datetime, os, re
          from pathlib import Path
          from zoneinfo import ZoneInfo
          out=Path("results")
          report={"akshare":ak.__version__,"collected_at":datetime.datetime.now(ZoneInfo("Asia/Shanghai")).isoformat(),"run_id":os.environ["GITHUB_RUN_ID"],"scope":"SSE SZSE BSE A shares; upstream current universe only"}
          def resolve(name):
              try:
                  return name,getattr(ak,name)
              except AttributeError as e:
                  m=re.search(r"请改用 ak\.([a-zA-Z0-9_]+)",str(e))
                  if m:
                      return m.group(1),getattr(ak,m.group(1))
                  raise
          def fetch(label,name,**kwargs):
              try:
                  actual,fn=resolve(name)
                  df=fn(**kwargs)
                  if not isinstance(df,pd.DataFrame) or df.empty:
                      raise ValueError("empty or invalid response")
                  df.to_csv(out/(label+".csv"),index=False,encoding="utf-8-sig")
                  col=next((c for c in df.columns if str(c).lower() in ("代码","股票代码","证券代码","a股代码","a股证券代码","code","symbol")),None)
                  if col is None:
                      raise ValueError("no recognized security code field")
                  codes=df[col].astype(str).str.strip().str.extract(r"^(?:sh|sz|bj)?(\d{1,6})$",expand=False).str.zfill(6)
                  valid=codes.dropna()
                  def venue(c):
                      if c.startswith(("600","601","603","605","688","689")): return "SSE"
                      if c.startswith(("000","001","002","003","300","301")): return "SZSE"
                      if c.startswith(("4","8","92")): return "BSE"
                      return "other_or_unclassified"
                  report[label]={"interface":actual,"rows":len(df),"unique_codes":int(valid.nunique()),"duplicate_codes":int(valid.duplicated().sum()),"invalid_codes":int(codes.isna().sum()),"venue_prefix_estimate":valid.drop_duplicates().map(venue).value_counts().to_dict(),"columns":list(df.columns),"missing_by_column":df.isna().sum().to_dict(),"sample_688521":df.loc[codes.eq("688521")].to_dict("records")}
                  return set(valid)
              except Exception as e:
                  report[label]={"interface_requested":name,"error":repr(e)}
                  traceback.print_exc()
                  return set()
          sh_main=fetch("sse_main","stock_info_sh_name_code",symbol="主板A股")
          sh_star=fetch("sse_star","stock_info_sh_name_code",symbol="科创板")
          sz=fetch("szse","stock_info_sz_name_code",symbol="A股列表")
          bj=fetch("bse","stock_info_bj_name_code")
          universe=sh_main|sh_star|sz|bj
          report["universe"]={"unique_codes":len(universe),"exchange_lists_complete":bool(sh_main and sh_star and sz and bj),"exchange_counts":{"SSE":len(sh_main|sh_star),"SZSE":len(sz),"BSE":len(bj)}}
          pd.DataFrame({"code":sorted(universe)}).to_csv(out/"universe_codes.csv",index=False)
          spot=fetch("spot_sina","stock_zh_a_spot")
          if universe and spot:
              report["comparison"]={"intersection":len(universe & spot),"universe_only":len(universe-spot),"spot_only":len(spot-universe),"coverage_vs_reference":len(universe & spot)/len(universe),"reference_only_codes":sorted(universe-spot),"spot_only_codes":sorted(spot-universe)}
          report["quality_gate"]=bool(report["universe"]["exchange_lists_complete"] and spot and len(universe & spot)/len(universe)>=0.98 and not report["spot_sina"]["duplicate_codes"] and len(universe)>=5000 and all(report["spot_sina"]["venue_prefix_estimate"].get(x,0)>0 for x in ("SSE","SZSE","BSE")))
          report["valuation_status"]="not validated; separate task required"
          (out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-share-universe-baseline
          path: results/
          retention-days: 7
          if-no-files-found: error
      - name: Publish run pointer only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,requests
          from pathlib import Path
          report=Path("results/report.json")
          pointer={"run_id":os.environ["GITHUB_RUN_ID"],"run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"],"report_generated":report.exists()}
          if report.exists():
              r=json.loads(report.read_text())
              pointer["quality_gate"]=r["quality_gate"]
              pointer["valuation_status"]=r.get("valuation_status")
              pointer["counts"]={k:r.get(k,{}).get("unique_codes") for k in ("universe","spot_sina")}
          url=os.environ["GITHUB_API_URL"]+"/repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/test-status/a-share-universe.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          old=requests.get(url,headers=headers,timeout=20)
          data={"message":"Record universe baseline run pointer","content":base64.b64encode(json.dumps(pointer,indent=2).encode()).decode(),"branch":"main"}
          if old.status_code==200: data["sha"]=old.json()["sha"]
          elif old.status_code!=404: old.raise_for_status()
          response=requests.put(url,headers=headers,json=data,timeout=20)
          response.raise_for_status()
          print("Run pointer saved")
          PY
      - name: Enforce data quality gate
        if: always()
        run: python -c 'import json; assert json.load(open("results/report.json"))["quality_gate"], "Universe data incomplete; see report"'
